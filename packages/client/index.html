<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/logo-loading.css" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Self-hosted AI chat dashboard for Hermes Agent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ekko Studio" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ekko Studio</title>
  <style>
    html,
    body,
    #app {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #f7f7f4;
    }

    html.dark body {
      background: #1a1a1a;
    }

    .boot-fallback {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #222222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    html.dark .boot-fallback {
      color: #f0f0f0;
    }

    html.hermes-desktop-windows,
    html.hermes-desktop-windows body,
    html.hermes-desktop-windows #app {
      background: transparent;
    }

    html.hermes-desktop-windows .boot-fallback {
      background: #f7f7f4;
      border-radius: 10px;
      overflow: hidden;
    }

    html.hermes-desktop-windows.dark .boot-fallback {
      background: #1a1a1a;
    }

    .boot-fallback__logo-wrap {
      --studio-loading-size: 72px;
    }

    /* one /logo.png request on cold load: the ::after mask re-fetches the URL
       the <img> already loaded, so sweep a plain rounded-rect highlight instead */
    .boot-fallback__logo-wrap::after {
      -webkit-mask: none;
      mask: none;
    }
  </style>

  <!-- Prevent FOUC by applying theme classes immediately -->
  <script>
    (function() {
      try {
        const brightness = localStorage.getItem('hermes_brightness') || 'system';
        const style = localStorage.getItem('hermes_style') === 'comic' ? 'comic' : 'ink';

        // Resolve dark mode
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = brightness === 'dark' || (brightness === 'system' && prefersDark);

        // Resolve comic style
        const isComic = style === 'comic';

        // Apply classes immediately
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        if (isComic) {
          document.documentElement.classList.add('comic');
        }

        // Declare CSS color-scheme synchronously (mirrors octopus/next-themes'
        // enableColorScheme). Android WebView's FORCE_DARK reads HTML's
        // color-scheme at first paint to decide whether the page supports a
        // dark theme — without it, it falls back to UA algorithmic darkening
        // (inverts images/icons) or fails to follow the system theme. Waiting
        // until Vue mounts is too late for the initial paint decision.
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

        const desktop = window.hermesDesktop;
        if (desktop?.isDesktop) {
          document.documentElement.classList.add('hermes-desktop-shell');
        }
        if (desktop?.isDesktop && desktop?.platform === 'win32') {
          document.documentElement.classList.add('hermes-desktop-windows');
        }
        if (desktop?.windowKind === 'pet' || window.location.hash.startsWith('#/desktop-pet')) {
          document.documentElement.classList.add('hermes-desktop-pet-window');
        }
      } catch (e) {
        console.warn('Failed to apply theme:', e);
      }
    })();
  </script>
</head>

<body>
  <div id="app">
    <div class="boot-fallback">
      <div class="boot-fallback__brand">
        <span class="boot-fallback__logo-wrap studio-loading-logo">
          <img src="/logo.png" alt="" />
        </span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
